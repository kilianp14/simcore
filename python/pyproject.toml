[project]
name = "simcore"
version = "0.1.0"
description = "Public Python API for simcore, a deterministic, discrete-event simulator."
requires-python = ">=3.13"
dependencies = ["cffi>=2.1.1"]

[build-system]
requires = ["setuptools>=61", "cffi>=2.1.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"
