name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.preset }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset:
          - clang-debug
          - clang-release
          - clang-sanitize
          - gcc-debug
          - gcc-release

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"

  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: |
          sudo apt update
          sudo apt install --yes clang-tidy

      - name: Configure
        run: cmake --preset clang-tidy

      - name: Analyze
        run: cmake --build --preset clang-tidy --parallel 2

  format:
    name: Formatting (clang-format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: |
          sudo apt update
          sudo apt install --yes clang-format

      - name: Check formatting
        run: |
          git ls-files -z -- \
            ':(glob)src/**/*.c' \
            ':(glob)src/**/*.h' \
            ':(glob)tests/**/*.c' \
            ':(glob)tests/**/*.h' |
            xargs -0 -r clang-format --dry-run --Werror

  python-bindings:
    name: Python bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7

      - name: Install
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Dependencies
        run: uv sync --locked --dev

      - name: Formatting
        run: uv run ruff format --check

      - name: Linting
        run: uv run ruff check

      - name: Type-checking
        run: uv run mypy

      - name: Testing
        run: uv run pytest
